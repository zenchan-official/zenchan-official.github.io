<style>
:root{--cream:#FFF1D6;--cream2:#FBE4BE;--brown:#503321;--soft:#7D5C46;--blue:#78BEE6;--card:#FFF8EA}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"M PLUS Rounded 1c",system-ui,sans-serif;color:var(--brown);background:linear-gradient(180deg,var(--cream2),var(--cream) 30%,var(--cream) 70%,var(--cream2));min-height:100vh;overflow-x:hidden}
main{max-width:480px;margin:0 auto;padding:44px 20px 40px;position:relative}
.deco{position:absolute;pointer-events:none;user-select:none}
.star{width:22px;height:22px;fill:var(--blue);stroke:#fff;stroke-width:1.6}
header{text-align:center}
.avatar{width:132px;height:132px;border-radius:50%;border:5px solid #fff;box-shadow:0 6px 18px rgba(80,51,33,.18);background:#fff}
h1{font-weight:800;font-size:2rem;margin-top:12px;letter-spacing:.02em;text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff}
.bio{font-weight:500;margin-top:6px;line-height:1.6}
.bio small{display:block;color:var(--soft);font-size:.85rem}
.links{display:flex;flex-direction:column;gap:14px;margin-top:28px}
.btn{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:999px;background:var(--card);border:3px solid var(--brown);color:var(--brown);text-decoration:none;font-weight:800;font-size:1.05rem;box-shadow:0 4px 0 var(--brown);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brown)}
.btn svg{width:28px;height:28px;flex:none}
.btn span{flex:1;line-height:1.25}
.btn span small{display:block;font-weight:500;font-size:.78rem;color:var(--soft)}
.btn.primary{background:var(--brown);color:#fff;font-size:1.15rem}
.btn.primary small{color:#F3DFC6}
.card{display:block;text-decoration:none;color:var(--brown);background:#fff;border-radius:22px;overflow:hidden;border:3px solid var(--brown);box-shadow:0 4px 0 var(--brown)}
.card img{width:100%;height:auto;display:block;aspect-ratio:16/9;object-fit:cover}
.card .t{padding:12px 16px 14px;font-weight:800;line-height:1.4}
.card .t small{display:block;font-weight:500;color:var(--soft);font-size:.8rem}
.label{font-size:.78rem;font-weight:800;color:#fff;background:var(--blue);display:inline-block;padding:2px 10px;border-radius:999px;margin-bottom:4px}
footer{text-align:center;margin-top:36px;font-size:.78rem;color:var(--soft)}
</style>
</head>
